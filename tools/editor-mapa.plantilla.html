<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor del mapa de troncales — Transporte Colussi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --rojo:#E22026; --negro:#1a1a1a; --borde:#e2e2e5; --texto:#2a2a2e;
    --suave:#6b6b73; --fondo:#f6f6f7; --ok:#047857; --aviso:#b45309;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--texto)}
  body{display:flex;flex-direction:column;background:var(--fondo)}

  header{background:#fff;border-bottom:1px solid var(--borde);padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:14px;margin:0;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
  header h1 span{color:var(--rojo)}
  .modos{display:flex;gap:5px;flex-wrap:wrap}
  .modo{border:1px solid var(--borde);background:#fff;border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer;font-weight:600;color:var(--texto)}
  .modo:hover{border-color:#b9b9c1}
  .modo.on{background:var(--rojo);color:#fff;border-color:var(--rojo)}
  .modo.on.borrar{background:#b91c1c;border-color:#b91c1c}

  .buscador{margin-left:auto;display:flex;gap:5px;align-items:center}
  .buscador input{border:1px solid var(--borde);border-radius:8px;padding:7px 10px;font-size:13px;width:190px}
  .buscador input:focus{outline:2px solid #fecaca;border-color:var(--rojo)}
  .ayuda{font-size:12px;color:var(--suave);width:100%;margin-top:1px;min-height:16px}
  .ayuda b{color:var(--texto)}

  main{flex:1;display:flex;min-height:0}
  #mapa{flex:1;min-width:0}
  aside{width:335px;background:#fff;border-left:1px solid var(--borde);display:flex;flex-direction:column;min-height:0}
  .sec{padding:11px 14px;border-bottom:1px solid var(--borde)}
  .sec h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--suave);margin:0 0 8px}
  .lista{overflow-y:auto;flex:1;min-height:70px}
  .fila{display:flex;align-items:center;gap:8px;padding:5px 14px;font-size:13px;border-bottom:1px solid #f2f2f4;cursor:pointer}
  .fila:hover{background:#fafafb}
  .fila.sel{background:#fff2f2}
  .fila.borrada{background:#fff2f2;color:#a3a3ab}
  .fila.borrada .nom{text-decoration:line-through}
  .swatch{width:12px;height:3px;border-radius:2px;flex:none}
  .fila .nom{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fila .n{font-size:11px;color:var(--suave);font-variant-numeric:tabular-nums}

  .btns{display:flex;gap:6px;flex-wrap:wrap}
  button.acc{border:1px solid var(--borde);background:#fff;border-radius:8px;padding:7px 10px;font-size:12.5px;cursor:pointer;font-weight:600}
  button.acc:hover{border-color:#b9b9c1}
  button.acc.rojo{background:var(--rojo);color:#fff;border-color:var(--rojo)}
  button.acc.gris{color:var(--suave)}
  button.acc:disabled{opacity:.4;cursor:not-allowed}

  #cambios{list-style:none;margin:0;padding:0;font-size:12.5px;max-height:170px;overflow-y:auto}
  #cambios li{padding:7px 14px;border-bottom:1px solid #f2f2f4;display:flex;gap:7px;align-items:flex-start}
  #cambios .tipo{font-weight:800;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;padding:2px 5px;border-radius:4px;flex:none;margin-top:1px}
  .t-borrar{background:#fee2e2;color:#b91c1c}
  .t-tramo{background:#ffedd5;color:#c2410c}
  .t-nueva{background:#dcfce7;color:var(--ok)}
  .t-nota{background:#fef3c7;color:var(--aviso)}
  #cambios .x{margin-left:auto;color:#b0b0b8;cursor:pointer;font-weight:700;flex:none}
  #cambios .x:hover{color:var(--rojo)}
  .vacio{padding:13px;font-size:12.5px;color:var(--suave);text-align:center}

  textarea{width:100%;height:110px;font-family:ui-monospace,Consolas,monospace;font-size:11px;border:1px solid var(--borde);border-radius:8px;padding:8px;resize:vertical}
  .pill{display:inline-block;background:var(--fondo);border:1px solid var(--borde);border-radius:99px;padding:1px 7px;font-size:11px;color:var(--suave)}
  .leaflet-container{background:#eee}
  .wp{background:var(--rojo);width:11px;height:11px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.28)}
  .pin-old{background:var(--negro);width:8px;height:8px;border-radius:50%;border:2px solid #fff;opacity:.7}
  .corte{background:#c2410c;width:13px;height:13px;border-radius:3px;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
  .snap{font-size:11px;color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header>
  <h1>Editor del mapa · <span>Colussi</span></h1>
  <div class="modos">
    <button class="modo on" data-modo="ver">👁 Ver</button>
    <button class="modo" data-modo="trazar">✏️ Trazar</button>
    <button class="modo borrar" data-modo="borrar">🗑 Borrar ruta</button>
    <button class="modo borrar" data-modo="tramo">✂️ Borrar tramo</button>
    <button class="modo" data-modo="nota">📌 Nota</button>
  </div>
  <div class="buscador">
    <input id="q" type="search" placeholder="Buscar localidad y saltar ahí…">
    <button class="acc" id="btn-buscar">Ir</button>
  </div>
  <div class="ayuda" id="ayuda">Clic en una ruta para verla resaltada.</div>
</header>

<main>
  <div id="mapa"></div>
  <aside>
    <div class="sec">
      <h2>Rutas <span class="pill" id="cuenta"></span></h2>
      <div class="btns">
        <button class="acc gris" id="btn-todas">Quitar resaltado</button>
      </div>
    </div>
    <div class="lista" id="lista"></div>

    <div class="sec">
      <h2>Trazando</h2>
      <div id="estado-traza" style="font-size:12.5px;color:var(--suave)">Ningún trazado en curso.</div>
      <div class="btns" style="margin-top:8px">
        <button class="acc" id="btn-deshacer" disabled>Deshacer punto</button>
        <button class="acc rojo" id="btn-guardar" disabled>Guardar ruta</button>
        <button class="acc gris" id="btn-cancelar" disabled>Cancelar</button>
      </div>
    </div>

    <div class="sec" style="border-bottom:none">
      <h2>Cambios marcados <span class="pill" id="cuenta-cambios">0</span></h2>
    </div>
    <ul id="cambios"><li class="vacio">Todavía no marcaste nada.</li></ul>

    <div class="sec">
      <button class="acc rojo" id="btn-copiar" style="width:100%">📋 Copiar para Claude</button>
      <textarea id="salida" readonly placeholder="Acá aparece el texto para pegarle a Claude." style="margin-top:8px"></textarea>
    </div>
  </aside>
</main>

<script>
const DATOS = __DATOS__;
const SNAP_PX = 14;   // cuán cerca hay que hacer clic para que enganche

// ---------------------------------------------------------------- mapa
const mapa = L.map('mapa', { scrollWheelZoom: true }).setView([-29.5, -58.5], 6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 18, subdomains: 'abcd'
}).addTo(mapa);

const PALETA = ['#E22026','#1d4ed8','#047857','#b45309','#7c3aed','#be185d','#0891b2','#4d7c0f',
                '#9a3412','#4338ca','#0f766e','#a16207','#6d28d9','#b91c1c'];
const capas = {};
let seleccion = null;

Object.keys(DATOS.rutas).forEach((clave, i) => {
  const color = PALETA[i % PALETA.length];
  const linea = L.polyline(DATOS.rutas[clave], { color, weight: 4, opacity: .85, lineCap:'round', lineJoin:'round' }).addTo(mapa);
  linea.bindTooltip(clave, { sticky: true });
  linea.on('click', (e) => { L.DomEvent.stop(e); alClicEnRuta(clave, e.latlng); });
  capas[clave] = { linea, color, borrada: false, tramos: [] };
});

DATOS.pines.forEach(p => {
  L.marker(p.coords, { icon: L.divIcon({ className:'', html:'<div class="pin-old"></div>', iconSize:[12,12], iconAnchor:[6,6] }) })
    .addTo(mapa).bindTooltip(`${p.nombre} — ${p.rol}`, { direction:'top' });
});

mapa.fitBounds(L.latLngBounds(Object.values(DATOS.rutas).flat()), { padding:[24,24] });

// ---------------------------------------------------------------- utilidades
// Devuelve el vertice mas cercano de cualquier ruta, y el pin mas cercano,
// dentro de SNAP_PX pixeles. Sirve para dos cosas: que los empalmes queden
// exactos sobre la linea existente, y para saber en que indice cortar un tramo.
function cercano(latlng) {
  const p0 = mapa.latLngToContainerPoint(latlng);
  let mejor = null;
  for (const [clave, pts] of Object.entries(DATOS.rutas)) {
    for (let i = 0; i < pts.length; i++) {
      const p = mapa.latLngToContainerPoint(L.latLng(pts[i]));
      const d = p0.distanceTo(p);
      if (d <= SNAP_PX && (!mejor || d < mejor.d)) mejor = { d, clave, indice: i, punto: pts[i] };
    }
  }
  return mejor;
}
function pinCercano(latlng) {
  const p0 = mapa.latLngToContainerPoint(latlng);
  let mejor = null;
  for (const pin of DATOS.pines) {
    const p = mapa.latLngToContainerPoint(L.latLng(pin.coords));
    const d = p0.distanceTo(p);
    if (d <= SNAP_PX + 4 && (!mejor || d < mejor.d)) mejor = { d, pin };
  }
  return mejor;
}
// nombre de la localidad mas cercana, para etiquetar los puntos
function nombreCerca(punto) {
  let mejor = null;
  for (const pin of DATOS.pines) {
    const d = L.latLng(punto).distanceTo(L.latLng(pin.coords)) / 1000;
    if (!mejor || d < mejor.d) mejor = { d, nombre: pin.nombre };
  }
  return mejor && mejor.d < 25 ? mejor.nombre : null;
}

// ---------------------------------------------------------------- lista
const $lista = document.getElementById('lista');
function pintarLista() {
  $lista.innerHTML = '';
  Object.keys(capas).forEach(clave => {
    const c = capas[clave];
    const fila = document.createElement('div');
    fila.className = 'fila' + (seleccion === clave ? ' sel' : '') + (c.borrada ? ' borrada' : '');
    const extra = c.tramos.length ? ` <span class="pill">${c.tramos.length} tramo${c.tramos.length>1?'s':''}</span>` : '';
    fila.innerHTML = `<span class="swatch" style="background:${c.color}"></span>
                      <span class="nom">${clave}${extra}</span>
                      <span class="n">${DATOS.rutas[clave].length}</span>`;
    fila.onclick = () => { if (modo === 'borrar') marcarBorrada(clave); else resaltar(clave); };
    $lista.appendChild(fila);
  });
  document.getElementById('cuenta').textContent = Object.keys(capas).length;
}

function resaltar(clave) {
  seleccion = clave;
  Object.entries(capas).forEach(([k, c]) => {
    c.linea.setStyle({ weight: k===clave?7:4, opacity: c.borrada ? .3 : (k===clave?1:.32) });
  });
  capas[clave].linea.bringToFront();
  pintarLista();
}
document.getElementById('btn-todas').onclick = () => {
  seleccion = null;
  Object.values(capas).forEach(c => c.linea.setStyle({ weight:4, opacity: c.borrada ? .35 : .85 }));
  pintarLista();
};
pintarLista();

// ---------------------------------------------------------------- modos
let modo = 'ver';
const AYUDAS = {
  ver: 'Clic en una ruta para verla resaltada.',
  trazar: 'Clic en cada punto por donde pasa la ruta. <b>Engancha solo</b> si tocás una ruta o una localidad que ya existe. Clic derecho deshace el último.',
  borrar: 'Clic sobre la ruta que hay que <b>eliminar entera</b>. Volvé a hacer clic para desmarcarla.',
  tramo: 'Clic en <b>los dos extremos del pedazo</b> que hay que sacar, sobre la misma ruta. Se marca en naranja lo que se va.',
  nota: 'Clic donde quieras dejarme una nota escrita.'
};
document.querySelectorAll('.modo').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.modo').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    modo = b.dataset.modo;
    document.getElementById('ayuda').innerHTML = AYUDAS[modo];
    document.getElementById('mapa').style.cursor = modo === 'ver' ? '' : 'crosshair';
    cortePendiente = null;
  };
});

// ---------------------------------------------------------------- borrar ruta entera
function marcarBorrada(clave) {
  const c = capas[clave];
  c.borrada = !c.borrada;
  c.linea.setStyle({ dashArray: c.borrada ? '5 9' : null, opacity: c.borrada ? .35 : .85, weight: 4 });
  if (c.borrada) agregarCambio({ tipo:'borrar', clave });
  else quitarCambio(x => x.tipo === 'borrar' && x.clave === clave);
  pintarLista();
}

// ---------------------------------------------------------------- borrar tramo
let cortePendiente = null;   // { clave, indice, marcador }

function alClicEnRuta(clave, latlng) {
  if (modo === 'borrar') { marcarBorrada(clave); return; }
  if (modo === 'tramo')  { marcarCorte(clave, latlng); return; }
  if (modo === 'ver')    { resaltar(clave); return; }
}

function indiceMasCercano(clave, latlng) {
  const pts = DATOS.rutas[clave];
  let mejor = 0, dm = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const d = L.latLng(pts[i]).distanceTo(latlng);
    if (d < dm) { dm = d; mejor = i; }
  }
  return mejor;
}

function marcarCorte(clave, latlng) {
  const i = indiceMasCercano(clave, latlng);
  const punto = DATOS.rutas[clave][i];

  if (cortePendiente && cortePendiente.clave !== clave) {
    mapa.removeLayer(cortePendiente.marcador);
    cortePendiente = null;
  }

  if (!cortePendiente) {
    const m = L.marker(punto, { icon: L.divIcon({ className:'', html:'<div class="corte"></div>', iconSize:[15,15], iconAnchor:[7.5,7.5] }) })
      .addTo(mapa).bindTooltip('inicio del pedazo a borrar', { direction:'top' });
    cortePendiente = { clave, indice: i, marcador: m };
    document.getElementById('ayuda').innerHTML = '<b>Ahora marcá el otro extremo</b> del pedazo, sobre la misma ruta.';
    return;
  }

  const desde = Math.min(cortePendiente.indice, i);
  const hasta = Math.max(cortePendiente.indice, i);
  mapa.removeLayer(cortePendiente.marcador);
  cortePendiente = null;
  document.getElementById('ayuda').innerHTML = AYUDAS.tramo;

  if (hasta - desde < 2) { alert('Los dos puntos están casi en el mismo lugar. Marcá los extremos del pedazo.'); return; }

  const sub = DATOS.rutas[clave].slice(desde, hasta + 1);
  const resalte = L.polyline(sub, { color:'#c2410c', weight:9, opacity:.85, dashArray:'2 10', lineCap:'round' }).addTo(mapa);
  const km = sub.slice(0,-1).reduce((s,_,k)=> s + L.latLng(sub[k]).distanceTo(L.latLng(sub[k+1]))/1000, 0);

  capas[clave].tramos.push({ desde, hasta, resalte });
  agregarCambio({ tipo:'tramo', clave, desde, hasta, km,
                  p1: DATOS.rutas[clave][desde], p2: DATOS.rutas[clave][hasta], resalte });
  pintarLista();
}

// ---------------------------------------------------------------- trazar
let waypoints = [], marcadores = [], preview = null;

mapa.on('click', async (e) => {
  if (modo === 'nota') {
    const texto = prompt('¿Qué querés anotar acá?');
    if (!texto) return;
    const punto = [ +e.latlng.lat.toFixed(5), +e.latlng.lng.toFixed(5) ];
    L.marker(punto, { icon: L.divIcon({ className:'', html:'<div style="background:#b45309;width:12px;height:12px;border-radius:50%;border:2.5px solid #fff"></div>', iconSize:[14,14], iconAnchor:[7,7] }) })
      .addTo(mapa).bindTooltip(texto, { direction:'top' });
    agregarCambio({ tipo:'nota', punto, texto });
    return;
  }
  if (modo !== 'trazar') return;

  // snap: si el clic cae cerca de una ruta o de una localidad, se usa ese punto exacto
  let punto = [ +e.latlng.lat.toFixed(5), +e.latlng.lng.toFixed(5) ];
  let etiqueta = null;
  const pin = pinCercano(e.latlng);
  const vert = cercano(e.latlng);
  if (pin) { punto = pin.pin.coords; etiqueta = pin.pin.nombre; }
  else if (vert) { punto = vert.punto; etiqueta = `sobre ${vert.clave}`; }
  else { const n = nombreCerca(punto); if (n) etiqueta = `cerca de ${n}`; }

  waypoints.push({ punto, etiqueta });
  const m = L.marker(punto, { icon: L.divIcon({ className:'', html:'<div class="wp"></div>', iconSize:[13,13], iconAnchor:[6.5,6.5] }) })
    .addTo(mapa).bindTooltip(`${waypoints.length}${etiqueta ? ' · ' + etiqueta : ''}`, { direction:'top' });
  marcadores.push(m);
  await recalcular();
});

// clic derecho deshace
mapa.on('contextmenu', async (e) => {
  L.DomEvent.stop(e);
  if (modo === 'trazar' && waypoints.length) { await deshacer(); }
});

async function deshacer() {
  waypoints.pop();
  const m = marcadores.pop();
  if (m) mapa.removeLayer(m);
  await recalcular();
}

async function recalcular() {
  const $e = document.getElementById('estado-traza');
  document.getElementById('btn-deshacer').disabled = !waypoints.length;
  document.getElementById('btn-cancelar').disabled = !waypoints.length;
  document.getElementById('btn-guardar').disabled = waypoints.length < 2;
  if (preview) { mapa.removeLayer(preview); preview = null; }
  if (waypoints.length < 2) {
    $e.innerHTML = waypoints.length ? '1 punto puesto. Marcá al menos uno más.' : 'Ningún trazado en curso.';
    return;
  }
  $e.textContent = `Calculando el camino real entre ${waypoints.length} puntos…`;
  try {
    const coords = waypoints.map(w => `${w.punto[1]},${w.punto[0]}`).join(';');
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
    const j = await r.json();
    if (j.code !== 'Ok') throw new Error(j.code);
    preview = L.polyline(j.routes[0].geometry.coordinates.map(([lo,la]) => [la,lo]),
      { color:'#047857', weight:6, opacity:.9, dashArray:'1 10', lineCap:'round' }).addTo(mapa);
    $e.innerHTML = `<b>${waypoints.length} puntos</b> · ${(j.routes[0].distance/1000).toFixed(0)} km de camino real.`;
  } catch (err) {
    $e.innerHTML = `<span style="color:#b91c1c">No se pudo calcular (${err.message}). Igual guardá: los puntos me sirven.</span>`;
  }
}

document.getElementById('btn-deshacer').onclick = deshacer;
document.getElementById('btn-cancelar').onclick = () => {
  waypoints = []; marcadores.forEach(m => mapa.removeLayer(m)); marcadores = [];
  if (preview) { mapa.removeLayer(preview); preview = null; }
  recalcular();
};
document.getElementById('btn-guardar').onclick = () => {
  if (waypoints.length < 2) return;
  const nombre = prompt('¿Qué es esta ruta? (ej: "de Saladas a Mercedes", "corregir el tramo de Iguazú")');
  if (nombre === null) return;
  agregarCambio({ tipo:'nueva', nombre: nombre || '(sin nombre)', puntos: waypoints.slice() });
  if (preview) { preview.setStyle({ dashArray:null, opacity:.7 }); preview = null; }
  waypoints = []; marcadores = [];
  recalcular();
};

// ---------------------------------------------------------------- buscador
async function buscar() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const $a = document.getElementById('ayuda');
  $a.textContent = `Buscando "${q}"…`;
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ar&q=${encodeURIComponent(q)}`);
    const j = await r.json();
    if (!j.length) { $a.innerHTML = `No encontré <b>${q}</b>.`; return; }
    const { lat, lon, display_name } = j[0];
    mapa.setView([+lat, +lon], 11);
    L.popup().setLatLng([+lat, +lon]).setContent(`<b>${q}</b><br><span style="font-size:11px">${display_name.slice(0,70)}</span>`).openOn(mapa);
    $a.innerHTML = AYUDAS[modo];
  } catch { $a.textContent = 'No pude buscar (¿sin internet?).'; }
}
document.getElementById('btn-buscar').onclick = buscar;
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });

// ---------------------------------------------------------------- cambios
let cambios = [];
const $cambios = document.getElementById('cambios');
function agregarCambio(c) { cambios.push(c); pintarCambios(); }
function quitarCambio(pred) { cambios = cambios.filter(x => !pred(x)); pintarCambios(); }

function pintarCambios() {
  document.getElementById('cuenta-cambios').textContent = cambios.length;
  if (!cambios.length) { $cambios.innerHTML = '<li class="vacio">Todavía no marcaste nada.</li>'; generarSalida(); return; }
  $cambios.innerHTML = '';
  cambios.forEach((c, i) => {
    const li = document.createElement('li');
    let txt = '', clase = '', etq = '';
    if (c.tipo === 'borrar') { etq='borrar'; clase='t-borrar'; txt = c.clave; }
    if (c.tipo === 'tramo')  { etq='tramo';  clase='t-tramo';  txt = `${c.clave} · ${c.km.toFixed(0)} km`; }
    if (c.tipo === 'nueva')  { etq='nueva';  clase='t-nueva';  txt = `${c.nombre} (${c.puntos.length} pts)`; }
    if (c.tipo === 'nota')   { etq='nota';   clase='t-nota';   txt = c.texto; }
    li.innerHTML = `<span class="tipo ${clase}">${etq}</span><span>${txt}</span><span class="x" title="quitar">✕</span>`;
    li.querySelector('.x').onclick = () => {
      if (c.tipo === 'borrar' && capas[c.clave]) {
        capas[c.clave].borrada = false;
        capas[c.clave].linea.setStyle({ dashArray:null, opacity:.85 });
      }
      if (c.tipo === 'tramo') {
        if (c.resalte) mapa.removeLayer(c.resalte);
        capas[c.clave].tramos = capas[c.clave].tramos.filter(t => !(t.desde === c.desde && t.hasta === c.hasta));
      }
      cambios.splice(i, 1);
      pintarCambios(); pintarLista();
    };
    $cambios.appendChild(li);
  });
  generarSalida();
}

function generarSalida() {
  if (!cambios.length) { document.getElementById('salida').value = ''; return; }
  const L2 = ['=== CAMBIOS MARCADOS EN EL EDITOR DEL MAPA ===',
              `(generado el ${new Date().toLocaleString('es-AR')})`, ''];
  cambios.forEach((c, i) => {
    if (c.tipo === 'borrar') L2.push(`${i+1}. BORRAR LA RUTA ENTERA: ${c.clave}`);
    if (c.tipo === 'tramo') {
      L2.push(`${i+1}. BORRAR UN TRAMO de ${c.clave}`);
      L2.push(`   vertices ${c.desde} a ${c.hasta} (de ${DATOS.rutas[c.clave].length}) · ${c.km.toFixed(0)} km`);
      L2.push(`   desde ${c.p1.join(',')} hasta ${c.p2.join(',')}`);
    }
    if (c.tipo === 'nota') L2.push(`${i+1}. NOTA en ${c.punto.join(',')} -> "${c.texto}"`);
    if (c.tipo === 'nueva') {
      L2.push(`${i+1}. RUTA NUEVA/CORREGIDA: "${c.nombre}"`);
      L2.push(`   waypoints: ${c.puntos.map(w => w.punto.join(',')).join(' ; ')}`);
      const etqs = c.puntos.map(w => w.etiqueta).filter(Boolean);
      if (etqs.length) L2.push(`   pasa por: ${etqs.join(' -> ')}`);
    }
  });
  L2.push('', '(los waypoints van en lat,lon — Claude los rutea con OSRM y los simplifica igual que el resto del mapa)');
  document.getElementById('salida').value = L2.join('\n');
}

document.getElementById('btn-copiar').onclick = async () => {
  const t = document.getElementById('salida');
  if (!t.value) { alert('Todavía no marcaste ningún cambio.'); return; }
  try {
    await navigator.clipboard.writeText(t.value);
    const b = document.getElementById('btn-copiar');
    b.textContent = '✓ Copiado, pegáselo a Claude';
    setTimeout(() => b.textContent = '📋 Copiar para Claude', 2200);
  } catch { t.select(); alert('No pude copiar solo. Quedó seleccionado: Ctrl+C.'); }
};
</script>
